import net.neoforged.moddevgradle.dsl.ModModel

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude('**/.cache/**')
}

repositories {
    maven {
        url = uri('https://api.modrinth.com/maven')
        content { includeGroup 'maven.modrinth' }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

String gameTestNamespace = project.property('mod_id').toString()
SourceSet mainModSourceSet = sourceSets.named('main').get()
def standardGameTestDirectory = layout.projectDirectory.dir('run/gametest')
def betterCombatGameTestDirectory = layout.projectDirectory.dir('run/gametest_better_combat')
def compatGameTestDirectory = layout.projectDirectory.dir('run/gametest_compat')

sourceSets {
    betterCombat {
        java.setSrcDirs([])
        resources.setSrcDirs([])
        runtimeClasspath += mainModSourceSet.output
    }
    compat {
        java.setSrcDirs([])
        resources.setSrcDirs([])
        runtimeClasspath += mainModSourceSet.output
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespace
        }

        clientBetterCombat {
            client()
            sourceSet = sourceSets.betterCombat
            gameDirectory = project.file('run/better_combat')
            systemProperty 'magitinkerer.expectBetterCombat', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespace
        }

        clientCompat {
            client()
            sourceSet = sourceSets.compat
            gameDirectory = project.file('run/compat')
            systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespace
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespace
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = standardGameTestDirectory.asFile
            systemProperty 'magitinkerer.expectBetterCombat', 'false'
            systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespace
        }

        gameTestServerBetterCombat {
            type = 'gameTestServer'
            sourceSet = sourceSets.betterCombat
            gameDirectory = betterCombatGameTestDirectory.asFile
            systemProperty 'magitinkerer.expectBetterCombat', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespace
        }

        gameTestServerCompat {
            type = 'gameTestServer'
            sourceSet = sourceSets.compat
            gameDirectory = compatGameTestDirectory.asFile
            systemProperty 'magitinkerer.expectMalum', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespace
        }

        data {
            data()
            programArguments.addAll '--mod', gameTestNamespace, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods.register(gameTestNamespace) { ModModel mod ->
        mod.sourceSet(mainModSourceSet)
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    betterCombatRuntimeClasspath.extendsFrom runtimeClasspath
    compatRuntimeClasspath.extendsFrom runtimeClasspath
}

dependencies {
    implementation "maven.modrinth:magitech_mod:${magitech_modrinth_version_id}"
    implementation "maven.modrinth:atlas-api:${atlas_api_modrinth_version_id}"

    // Modrinth Maven では前提 MOD を個別に指定する。
    localRuntime "maven.modrinth:modonomicon:${modonomicon_modrinth_version_id}"
    localRuntime "maven.modrinth:lodestonelib:${lodestone_modrinth_version_id}"
    localRuntime "maven.modrinth:geckolib:${geckolib_modrinth_version_id}"
    localRuntime "maven.modrinth:curios:${curios_modrinth_version_id}"
    localRuntime "maven.modrinth:playeranimator:${playeranimator_modrinth_version_id}"
    localRuntime "maven.modrinth:terrablender:${terrablender_modrinth_version_id}"

    // 全開発構成で共通の QoL MOD とその前提 MOD。
    localRuntime "maven.modrinth:mezzconfig:${mezzconfig_modrinth_version_id}"
    localRuntime "maven.modrinth:jei:${jei_modrinth_version_id}"
    localRuntime "maven.modrinth:jade:${jade_modrinth_version_id}"
    localRuntime "maven.modrinth:moonlight:${moonlight_modrinth_version_id}"
    localRuntime "maven.modrinth:Adega8YN:${target_dummy_modrinth_version_id}"

    compileOnly "maven.modrinth:better-combat:${better_combat_modrinth_version_id}"
    compileOnly "maven.modrinth:lodestonelib:${lodestone_modrinth_version_id}"
    // 実行時は Better Combat が同梱する版を使う。
    compileOnly "maven.modrinth:tiny-config:${tiny_config_modrinth_version_id}"
    betterCombatRuntimeOnly "maven.modrinth:better-combat:${better_combat_modrinth_version_id}"
    betterCombatRuntimeOnly "maven.modrinth:cloth-config:${cloth_config_modrinth_version_id}"
    compileOnly "maven.modrinth:malum:${malum_modrinth_version_id}"
    compatRuntimeOnly "maven.modrinth:malum:${malum_modrinth_version_id}"
}

apply from: 'scripts/text-encoding.gradle'

def cleanGameTestWorld = tasks.register('cleanGameTestWorld', Delete) {
    delete standardGameTestDirectory.dir('world')
}
def cleanBetterCombatGameTestWorld = tasks.register('cleanBetterCombatGameTestWorld', Delete) {
    delete betterCombatGameTestDirectory.dir('world')
}
def cleanCompatGameTestWorld = tasks.register('cleanCompatGameTestWorld', Delete) {
    delete compatGameTestDirectory.dir('world')
}
tasks.named('runGameTestServer').configure { dependsOn cleanGameTestWorld }
tasks.named('runGameTestServerBetterCombat').configure { dependsOn cleanBetterCombatGameTestWorld }
tasks.named('runGameTestServerCompat').configure { dependsOn cleanCompatGameTestWorld }

tasks.named('jar', Jar).configure {
    from(['LICENSE', 'ASSETS_LICENSE.md', 'THIRD_PARTY_NOTICES.md', 'TEMPLATE_LICENSE.txt']) {
        into 'META-INF'
    }
    exclude('jp/aquafactory/magitinkerer/gametest/**')
    exclude('data/magitinkerer/structure/gametest/**')
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version_range : minecraft_version_range,
            neo_version_range       : neo_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            magitech_version        : magitech_version,
            atlas_api_version       : atlas_api_version,
            better_combat_version   : better_combat_version,
            malum_version           : malum_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            SoftwareComponent javaComponent = components.getByName('java')
            from javaComponent
        }
    }
    repositories {
        maven {
            url = layout.projectDirectory.dir('repo').asFile.toURI()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
