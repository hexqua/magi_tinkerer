modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Aquid"
description='''An add-on that expands Magitech.'''

[[mixins]]
config="magitinkerer.bettercombat.mixins.json"
requiredMods=["bettercombat"]

[[mixins]]
config="magitinkerer.malum.mixins.json"
requiredMods=["malum"]

[[dependencies."${mod_id}"]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="magitech"
    type="required"
    versionRange="[${magitech_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="bettercombat"
    type="optional"
    versionRange="[${better_combat_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="malum"
    type="optional"
    versionRange="[${malum_version}]"
    ordering="AFTER"
    side="BOTH"
